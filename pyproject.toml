[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airdesk"
version = "0.1.0"
description = "Traceable mechanical and wireless power simulation demonstrator"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "pillow", "pyfemm", "pywin32; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["airdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
